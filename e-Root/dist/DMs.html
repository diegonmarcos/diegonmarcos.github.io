    .theme-switch {

      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      max-width: calc(100vw - 24px);
    }
    .theme-switch__row {
      display: flex;
      align-items: center;
      gap: 1px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .theme-switch__row::-webkit-scrollbar { display: none; }
    .theme-switch__btn {
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 6px 16px;
      border-radius: 999px;
      background: transparent;
      color: #b0b8cc;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .theme-switch__btn:hover { color: #fff; }
    .theme-switch__btn.is-active { background: #fff; color: #111; }
    .theme-switch__divider {
      flex: 0 0 auto;
      align-self: center;
      color: rgba(255, 255, 255, 0.3);
      padding: 0 2px;
    }
    .theme-switch__row--hubs {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.5);
      padding-bottom: 6px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .theme-switch__hub-link {
      color: inherit;
      text-decoration: none;
      opacity: 0.6;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .theme-switch__hub-link--active {
      opacity: 1;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }
    .theme-switch__home {
      position: fixed; top: 16px; left: 16px;
      color: #b0b8cc; text-decoration: none; font-size: 1.2rem;
      z-index: 100;
    }

    /* ── DMs page content ── */
    .dms-page {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 16px 40px;
    }
    .dms-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .dms-title {
      font-size: 2rem;
      font-weight: 800;
      color: #e4e6eb;
      margin: 0 0 4px;
    }
    .dms-subtitle {
      color: #b0b3b8;
      font-size: 0.9rem;
    }
    .dms-channels {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .dm-channel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      background: #181818;
      color: #e4e6eb;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid #303030;
      transition: transform 0.2s, background 0.2s;
    }
    .dm-channel:hover {
      transform: translateY(-2px);
      background: #242526;
      text-decoration: none;
    }
    .dm-channel__icon { font-size: 1.2rem; }

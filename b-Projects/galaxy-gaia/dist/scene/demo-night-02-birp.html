    // Self-debugging hook, moved here from +layout.svelte's onMount: a
    // Svelte component's onMount runs LATE (after hydration/routing has
    // already had a chance to fail) -- confirmed missing a real
    // SvelteKit router error ("Not found: /scene.html") that fired before
    // +layout.svelte ever mounted. This <script> runs at HTML PARSE time,
    // before any framework JS, so it catches everything from the earliest
    // possible point, including framework-internal errors.
    (function () {
      var LOG_URL = location.protocol + '//' + location.hostname + ':8787/log';
      function send(line) {
        var body = '[' + new Date().toISOString() + '] ' + line + '\n';
        if (!(navigator.sendBeacon && navigator.sendBeacon(LOG_URL, body))) {
          fetch(LOG_URL, { method: 'POST', body: body, keepalive: true }).catch(function () {});
        }
      }
      ['log', 'warn', 'error'].forEach(function (level) {
        var orig = console[level].bind(console);
        console[level] = function () {
          var args = Array.prototype.slice.call(arguments);
          send(level.toUpperCase() + ' ' + args.map(String).join(' '));
          orig.apply(console, args);
        };
      });
      window.addEventListener('error', function (e) {
        send('WINDOW-ERROR ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        send('UNHANDLED-REJECTION ' + e.reason);
      });
      window.addEventListener('webglcontextlost', function () {
        send('WEBGL-CONTEXT-LOST (GPU/VRAM exhaustion — this precedes a tab crash)');
      }, true);
    })();
  </script>

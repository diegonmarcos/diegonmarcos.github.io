name: GitHub Pages Deployment (CI)
on:
  push:
    branches: ["main"]
  # #876: cloud-u-android's ship-<app>-wasm workflow sends this when it has put a new
  # Cloud-<App>.wasm.zip on its rolling release; the portal refetches the pages.
  repository_dispatch:
    types: [cloud-web-refresh]
  # #1072: the split source repos cannot dispatch without a secret; redeploy daily and on demand.
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# Pages deployments 400 when bursts race; queue them instead of cancelling.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to compare changes
      # #1072: linktree and the project sources live in their own public repos;
      # overlay them at their original paths so every path below still resolves.
      # Each front repo carries the deployer as submodule 0_deployer plus symlinks 1_cicd and .github into it, so its
      # build.sh/ship.yml symlinks resolve standalone; those four entries belong to the repo, never to the overlay.
      - name: 🧩 Overlay split source repos
        run: |
          for r in front-linktree front-companies front-individual front-warehouse front-feeds front-media front-mydata front-profiles front-galaxy front-circus front-labtools front-suite front-others; do
            git clone --depth 1 "https://github.com/diegonmarcos/$r.git" "$RUNNER_TEMP/$r"
            rsync -a --exclude='.git' --exclude='README.md' --exclude='SPLIT-PATHS.txt' --exclude='/.gitmodules' --exclude='/0_deployer' --exclude='/1_cicd' --exclude='/.github' "$RUNNER_TEMP/$r/" ./
            sed 's#^#/#' "$RUNNER_TEMP/$r/SPLIT-PATHS.txt" >> .git/info/exclude
          done
      - name: 📂 Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v41
      # ============================================
      # SETUP NODE.JS
      # ============================================
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: 📦 Install Dependencies
        run: bash build.sh deps
      # ============================================
      # ENGINE PREFLIGHT — block deploy if engine tests fail
      # ============================================
      - name: 🧪 Engine tests — SW + cache subset
        # Excludes test_framework + test_watcher_reap (flaky in headless
        # CI; tracked separately). Runs the deterministic SW + cache
        # tests added by the SW-hashing modularization.
        run: bash 9_others/test/run.sh "test_front_cache_*" "test_front_sw_*" "test_engine_sw_*" "test_front_sw_register" "test_engine_copy_glob" "test_profiles_privacy"
      # ============================================
      # PROJECT BUILDS (All use build.sh)
      # ============================================
      - name: 🔨 Build Root Index (e-Root)
        id: build-c-root
        if:
          contains(steps.changed-files.outputs.all_changed_files, 'e-Root/src/')

        run: |
          echo "🔨 Building Root Index (e-Root)..."
          cd e-Root
          bash build.sh build
          cd ..
          echo "✅ Root Index build complete"
      - name: 🔨 Build Landpage
        id: build-landpage
        if:
          contains(steps.changed-files.outputs.all_changed_files, 'a_Individual/landpage/src/')

        run: |
          echo "🔨 Building Landpage..."
          cd a_Individual/landpage
          bash build.sh build
          cd ../..
          echo "✅ Landpage build complete"
      - name: 🔨 Build Linktree
        id: build-linktree
        if:
          contains(steps.changed-files.outputs.all_changed_files, 'a_Portals/linktree/src/')

        run: |
          echo "🔨 Building Linktree..."
          cd a_Portals/linktree
          bash build.sh build
          cd ../..
          echo "✅ Linktree build complete"
      - name: 🔨 Build Linktree Mindmap
        id: build-linktree-mindmap
        if:
          contains(steps.changed-files.outputs.all_changed_files, 'a_Portals/linktree_mindmap/src/')

        run: |
          echo "🔨 Building Linktree Mindmap..."
          cd a_Portals/linktree_mindmap
          bash build.sh build
          cd ../..
          echo "✅ Linktree Mindmap build complete"
      - name: 🔨 Build Linktree Pixel World
        id: build-linktree-pixel-world
        if:
          contains(steps.changed-files.outputs.all_changed_files, 'a_Portals/linktree_pixel-world/src/')

        run: |
          echo "🔨 Building Linktree Pixel World..."
          cd a_Portals/linktree_pixel-world
          bash build.sh build
          cd ../..
          echo "✅ Linktree Pixel World build complete"
      - name: 🔨 Build Linktree Icon View

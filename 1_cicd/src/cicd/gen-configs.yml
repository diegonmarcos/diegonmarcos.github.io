name: "Regenerate config data (1_front-configs)"

on:
  push:
    branches: [main]
    paths:
      - '**/build.json'
      - '**/package.json'
      - 'build.sh'
      - 'a_Portals/linktree/src/data/**.json'
      - '1_front-configs/build.sh'
      - '1_front-configs/build.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-configs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #1072: linktree and the project sources live in their own public repos;
      # overlay them at their original paths so every path below still resolves.
      - name: 🧩 Overlay split source repos
        run: |
          for r in front-linktree front-companies front-individual front-warehouse front-feeds front-media front-mydata front-profiles front-galaxy front-circus front-labtools front-suite front-others; do
            git clone --depth 1 "https://github.com/diegonmarcos/$r.git" "$RUNNER_TEMP/$r"
            rsync -a --exclude='.git' --exclude='README.md' --exclude='SPLIT-PATHS.txt' "$RUNNER_TEMP/$r/" ./
            sed 's#^#/#' "$RUNNER_TEMP/$r/SPLIT-PATHS.txt" >> .git/info/exclude
          done

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      # build.sh config → 1_front-configs/build.sh rebuild (consolidate + derive
      # front-topology.json + front-deps.json + front-data-*.json) → master index.
      # All outputs are committed in-repo; no submodule checkout needed.
      - name: Regenerate config data
        run: bash build.sh config

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 1_front-configs/dist/ 1_front-configs/src/ 0_______________________________/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: regenerate config data [skip ci]"
          git pull --rebase origin main
          git push

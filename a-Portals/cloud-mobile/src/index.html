<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cloud SuperApp | Mobile UI</title>
    <meta name="description" content="Web replica of the Cloud SuperApp Android launcher — home tile grid, drawer, bottom navigation.">
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://diegonmarcos.github.io/cloud-mobile/">
    <meta property="og:title" content="Cloud SuperApp | Mobile UI">
    <meta property="og:description" content="Web replica of the Cloud SuperApp Android launcher.">

<!-- Matomo Tag Manager -->
<script>
  var _mtm = window._mtm = window._mtm || [];
  _mtm.push({'mtm.startTime': (new Date().getTime()), 'event': 'mtm.Start'});
  (function() {
    var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
    g.async=true; g.src='https://analytics.diegonmarcos.com/js/container_odwLIyPV.js'; s.parentNode.insertBefore(g,s);
  })();
</script>
<!-- End Matomo Tag Manager -->

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <div class="galaxy-backdrop" aria-hidden="true"></div>

        <!-- Decorative constellation — home screen only, toggled via .is-home on .shell -->
        <button class="star star--sirius" id="star-sirius" type="button" aria-label="Open menu">✦</button>
        <span class="star star--canopus" aria-hidden="true">✦</span>
        <span class="star star--centauri" aria-hidden="true">✦</span>

        <!-- Top island -->
        <header class="toolbar-island">
            <button class="icon-btn" id="hamburger-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
                <img src="public/icons/menu.svg" alt="">
            </button>
            <button class="back-btn" id="back-btn" type="button" aria-label="Back" hidden>
                <img src="public/icons/back.svg" alt="">
            </button>
            <div class="dynamic-island" aria-hidden="true">
                <span class="dynamic-island__wave"></span>
                <span class="dynamic-island__label">Cloud SuperApp</span>
            </div>
            <span class="toolbar-island__spacer" aria-hidden="true"></span>
        </header>

        <!-- Content host -->
        <main class="content" id="content">
            <h1 class="content__title" id="content-title">Home</h1>

            <div class="tile-grid" id="tile-grid" role="list"></div>

            <div class="page-tabs" id="page-tabs" hidden role="tablist"></div>
            <div class="page-body" id="page-body" hidden></div>
        </main>

        <!-- Bottom island -->
        <nav class="bottom-nav" id="bottom-nav" aria-label="Primary">
            <button class="bottom-nav__item" data-section="communication" type="button">
                <img src="public/icons/chat.svg" alt=""><span>Comms</span>
            </button>
            <button class="bottom-nav__item" data-section="infos" type="button">
                <img src="public/icons/logs.svg" alt=""><span>Infos</span>
            </button>
            <button class="bottom-nav__item is-active" data-section="home" type="button">
                <img src="public/icons/home.svg" alt=""><span>Home</span>
            </button>
            <button class="bottom-nav__item" data-section="suite" type="button">
                <img src="public/icons/suite.svg" alt=""><span>Suite</span>
            </button>
            <button class="bottom-nav__item" data-section="tools" type="button">
                <img src="public/icons/tools.svg" alt=""><span>Labs</span>
            </button>
        </nav>
    </div>

    <!-- Drawer -->
    <div class="drawer-scrim" id="drawer-scrim"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer__banner drawer__banner--app" id="drawer-app-banner">
            <img src="public/icons/home.svg" alt="" class="drawer__banner-icon">
            <div class="drawer__banner-text">
                <p class="drawer__title" id="drawer-app-name">Cloud SuperApp</p>
                <p class="drawer__meta" id="drawer-app-build">cloud-mobile · web</p>
            </div>
        </div>
        <div class="drawer__separator"></div>
        <button class="drawer__banner drawer__banner--user" id="drawer-user-banner" type="button">
            <span class="drawer__avatar" id="drawer-user-avatar">DCM</span>
            <div class="drawer__banner-text">
                <p class="drawer__title" id="drawer-user-name">Diego Coelho Marcos</p>
                <p class="drawer__meta" id="drawer-user-email">me@diegonmarcos.com</p>
                <p class="drawer__mode"><span id="drawer-user-mode">Mode: Apps</span> <img src="public/icons/refresh.svg" alt="Swap mode"></p>
            </div>
        </button>
        <nav class="drawer__nav" id="drawer-nav"></nav>
    </aside>

    <script>window.PORTAL_DATA = window.PORTAL_DATA || {};</script>
    <script src="data-cloud-mobile.json.js"></script>
    <script src="script.js"></script>
</body>
</html>

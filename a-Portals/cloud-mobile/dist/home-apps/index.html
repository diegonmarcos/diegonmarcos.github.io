<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Home Apps · Cloud SuperApp</title>
    <link rel="icon" type="image/svg+xml" href="../public/favicon.svg">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#000000">
<script>
  var _mtm = window._mtm = window._mtm || [];
  _mtm.push({'mtm.startTime': (new Date().getTime()), 'event': 'mtm.Start'});
  (function() {
    var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
    g.async=true; g.src='https://analytics.diegonmarcos.com/js/container_odwLIyPV.js'; s.parentNode.insertBefore(g,s);
  })();
</script>
    <link rel="stylesheet" href="../style.css">
</head>
<body data-section="home-apps">
    <div class="shell">
        <div class="status-strip">
            <div class="status-strip__row">
                <div class="status-strip__cluster status-strip__cluster--left"><span class="status-strip__chip is-active">5G</span><span class="status-strip__chip is-active">WiFi</span><span class="status-strip__chip is-active">WG</span><span class="status-strip__chip">KDE</span><span class="status-strip__chip is-active">BT</span></div>
                <div class="status-strip__camera" aria-hidden="true"></div>
                <div class="status-strip__cluster status-strip__cluster--right"><span class="status-strip__chip">RAM 62%</span><span class="status-strip__chip">STO 48%</span><span class="status-strip__chip">CPU 17%</span><span class="status-strip__chip">BAT 84%</span></div>
            </div>
            <button class="status-strip__clock" id="status-clock" type="button" aria-label="Calendar">--:--</button>
        </div>
        <div class="galaxy-backdrop" aria-hidden="true"></div>
        

        <button class="star star--sirius" id="star-sirius" type="button" aria-label="Open menu">✦</button>
        <button class="star star--canopus" id="star-canopus" type="button" aria-label="Quick configs"><img class="star__icon" src="../public/icons/settings.svg" alt=""></button>
        <button class="star star--centauri" id="star-centauri" type="button" aria-label="Recent apps">✦</button>

        <button class="icon-btn icon-btn--hamburger" id="hamburger-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
            <img class="" src="../public/icons/menu.svg" alt="">
        </button>

        <div class="music-island" aria-hidden="true">
            <img class="music-island__icon" src="../public/icons/music.svg" alt="">
            <span class="music-island__marquee"><span class="music-island__title">Weightless — Marconi Union</span></span>
        </div>

        <button class="dynamic-island" id="dynamic-island" type="button" aria-label="Notifications">
            <span class="dynamic-island__wave-clip" aria-hidden="true">
                <span class="dynamic-island__wave dynamic-island__wave--1"></span>
                <span class="dynamic-island__wave dynamic-island__wave--2"></span>
                <span class="dynamic-island__wave dynamic-island__wave--3"></span>
                <span class="dynamic-island__wave dynamic-island__wave--4"></span>
            </span>
            <span class="dynamic-island__shimmer" aria-hidden="true"></span>
        </button>

        <a class="toolbar-action" href="/cloud-mobile/" aria-label="Back"><img class="" src="../public/icons/back.svg" alt=""></a>

        <main class="content" id="content">
            <div class="search-pill" aria-hidden="true">Search apps &amp; content</div>
            <div class="tile-grid" role="list">
                <a class="tile tile--green" href="/cloud-mobile/communication/" role="listitem"><img class="tile__icon" src="../public/icons/chat.svg" alt=""><span class="tile__label">Inboxes</span></a>
                <a class="tile tile--purple" href="/cloud-mobile/infos/" role="listitem"><img class="tile__icon" src="../public/icons/logs.svg" alt=""><span class="tile__label">Infos</span></a>
                <a class="tile tile--orange" href="/cloud-mobile/suite/" role="listitem"><img class="tile__icon" src="../public/icons/suite.svg" alt=""><span class="tile__label">Suite</span></a>
                <a class="tile tile--teal" href="/cloud-mobile/tools/" role="listitem"><img class="tile__icon" src="../public/icons/tools.svg" alt=""><span class="tile__label">Labs</span></a>
                <a class="tile tile--blue" href="/cloud-mobile/mail/" role="listitem"><img class="tile__icon" src="../public/icons/mail.svg" alt=""><span class="tile__label">Mail</span></a>
                <a class="tile tile--amber" href="/cloud-mobile/rss/" role="listitem"><img class="tile__icon" src="../public/icons/rss.svg" alt=""><span class="tile__label">RSS</span></a>
                <a class="tile tile--green" href="/cloud-mobile/calendar/" role="listitem"><img class="tile__icon" src="../public/icons/calendar.svg" alt=""><span class="tile__label">Calendar</span></a>
                <a class="tile tile--indigo" href="/cloud-mobile/drive/" role="listitem"><img class="tile__icon" src="../public/icons/database.svg" alt=""><span class="tile__label">Drive</span></a>
                <a class="tile tile--pink" href="/cloud-mobile/vault/" role="listitem"><img class="tile__icon" src="../public/icons/lock.svg" alt=""><span class="tile__label">Vault</span></a>
                <a class="tile tile--teal" href="/cloud-mobile/chat/" role="listitem"><img class="tile__icon" src="../public/icons/chat.svg" alt=""><span class="tile__label">Chat</span></a>
                <a class="tile tile--amber" href="/cloud-mobile/wg/" role="listitem"><img class="tile__icon" src="../public/icons/mesh.svg" alt=""><span class="tile__label">WG</span></a>
                <a class="tile tile--purple" href="/cloud-mobile/solutions/" role="listitem"><img class="tile__icon" src="../public/icons/briefcase.svg" alt=""><span class="tile__label">Solutions</span></a>
                <a class="tile tile--teal" href="/cloud-mobile/apptabs/" role="listitem"><img class="tile__icon" src="../public/icons/suite.svg" alt=""><span class="tile__label">Tabs</span></a>
                <a class="tile tile--green" href="/cloud-mobile/myfin/" role="listitem"><img class="tile__icon" src="../public/icons/chart.svg" alt=""><span class="tile__label">MyFin</span></a>
                <a class="tile tile--pink" href="/cloud-mobile/health/" role="listitem"><img class="tile__icon" src="../public/icons/heart.svg" alt=""><span class="tile__label">MyHealth</span></a>
                <a class="tile tile--indigo" href="/cloud-mobile/wallet/" role="listitem"><img class="tile__icon" src="../public/icons/wallet.svg" alt=""><span class="tile__label">Wallet</span></a>
                <a class="tile tile--blue" href="/cloud-mobile/config/" role="listitem"><img class="tile__icon" src="../public/icons/settings.svg" alt=""><span class="tile__label">Configs</span></a>
            </div>
        </main>

        <nav class="bottom-nav" id="bottom-nav" aria-label="Primary">
            <a class="bottom-nav__item" href="../communication/" data-longpress="communication"><img class="" src="../public/icons/chat.svg" alt=""><span>Inboxes</span></a>
            <a class="bottom-nav__item" href="../infos/" data-longpress="infos"><img class="" src="../public/icons/logs.svg" alt=""><span>Infos</span></a>
            <a class="bottom-nav__item" href="../" data-longpress="home"><img class="" src="../public/icons/home.svg" alt=""><span>Home</span></a>
            <a class="bottom-nav__item" href="../suite/" data-longpress="suite"><img class="" src="../public/icons/suite.svg" alt=""><span>Suite</span></a>
            <a class="bottom-nav__item" href="../tools/" data-longpress="tools"><img class="" src="../public/icons/tools.svg" alt=""><span>Labs</span></a>
        </nav>

        <div class="drawer-scrim" id="drawer-scrim"></div>
        <aside class="drawer" id="drawer" aria-hidden="true">
            <div class="drawer__banner drawer__banner--app" id="drawer-app-banner">
                <img class="drawer__banner-icon" src="../public/icons/home.svg" alt="">
                <div class="drawer__banner-text">
                    <p class="drawer__title" id="drawer-app-name">Cloud SuperApp</p>
                    <p class="drawer__meta" id="drawer-app-build">cloud-mobile · web</p>
                </div>
            </div>
            <div class="drawer__separator"></div>
            <button class="drawer__banner drawer__banner--user" id="drawer-user-banner" type="button">
                <span class="drawer__avatar" id="drawer-user-avatar">DCM</span>
                <div class="drawer__banner-text">
                    <p class="drawer__title" id="drawer-user-name">Diego Coelho Marcos</p>
                    <p class="drawer__meta" id="drawer-user-email">me@diegonmarcos.com</p>
                    <p class="drawer__mode"><span id="drawer-user-mode">Mode: Apps</span> <img class="" src="../public/icons/refresh.svg" alt=""></p>
                </div>
            </button>
            <nav class="drawer__nav" id="drawer-nav"></nav>
        </aside>

        <div class="radial-menu" id="radial-menu" hidden aria-hidden="true"></div>
        <div class="fan-menu-scrim" id="fan-menu-scrim" hidden></div>
        <div class="fan-menu" id="fan-menu" hidden aria-hidden="true"></div>
        <div class="overlay-sheet" id="notification-center" hidden></div>
        <div class="overlay-sheet overlay-sheet--full" id="update-overlay" hidden></div>
        <div class="overlay-sheet" id="calendar-popup" hidden></div>
    </div>

    <script>window.PORTAL_DATA = window.PORTAL_DATA || {};</script>
    <script src="../data-shell.json.js"></script>
    <script src="../data-sections-core.json.js"></script>
    <script src="../data-sections-content.json.js"></script>
    <script src="../data-mock-apps.json.js"></script>
    <script src="../script.js"></script>
</body>
</html>

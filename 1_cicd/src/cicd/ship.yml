            "cloud-webapps/cloud-contacts:cloud-webapps/cloud-contacts"
            "cloud-webapps/cloud-dialer:cloud-webapps/cloud-dialer"
            "cloud-webapps/cloud-drive:cloud-webapps/cloud-drive"
            "cloud-webapps/cloud-gallery:cloud-webapps/cloud-gallery"
            "cloud-webapps/cloud-keyboard:cloud-webapps/cloud-keyboard"
            "cloud-webapps/cloud-mail:cloud-webapps/cloud-mail"
            "cloud-webapps/cloud-matrix:cloud-webapps/cloud-matrix"
            "cloud-webapps/cloud-me:cloud-webapps/cloud-me"
            "cloud-webapps/cloud-media:cloud-webapps/cloud-media"
            "cloud-webapps/cloud-myterminal:cloud-webapps/cloud-myterminal"
            "cloud-webapps/cloud-nav:cloud-webapps/cloud-nav"
            "cloud-webapps/cloud-news:cloud-webapps/cloud-news"
            "cloud-webapps/cloud-notes:cloud-webapps/cloud-notes"
            "cloud-webapps/cloud-office:cloud-webapps/cloud-office"
            "cloud-webapps/cloud-search:cloud-webapps/cloud-search"
            "cloud-webapps/cloud-store:cloud-webapps/cloud-store"
            "cloud-webapps/cloud-superapp:cloud-webapps/cloud-superapp"
            "cloud-webapps/cloud-tasks:cloud-webapps/cloud-tasks"
            "cloud-webapps/cloud-terminal:cloud-webapps/cloud-terminal"
            "cloud-webapps/cloud-tools-small-llms:cloud-webapps/cloud-tools-small-llms"
            "cloud-webapps/cloud-vault:cloud-webapps/cloud-vault"
            "cloud-webapps/cloud-wallet:cloud-webapps/cloud-wallet"
            "cloud-webapps/cloud-writer:cloud-webapps/cloud-writer"
            "e-Others/others:others"
            "c_LabTools/sailytics:sailytics"
            "c_LabTools/news:news"
            "c_LabTools/fin-terminal:fin-terminal"
            "c_LabTools/Music_DJ-Mixer_Mixxx:Music_DJ-Mixer_Mixxx"
            "c_LabTools/Music_DAW_LLMS:Music_DAW_LLMS"
            "b_MyData/my-fin:my-fin"
            "b_Media/mySocials:mySocials"
            "b_MyData/myhealth:myhealth"
            "b_MyData/myhealth-tracker:myhealth-tracker"
            "b_MyData/myid:myid"
            "c_Suite/mymaps:mymaps"
          )
          for entry in "${PROJECTS[@]}"; do
            SRC="${entry%%:*}"
            NAME="${entry##*:}"
            DIST="$SRC/dist"
            # Special cases
            if [ ! -d "$DIST" ]; then
              echo "⏭️  $NAME (no dist/)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            # Check dist has files
            if [ -z "$(ls -A "$DIST" 2>/dev/null)" ]; then
              echo "⚠️  $NAME (dist/ empty)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            # Copy (dot-copy resolves symlinks, never fails on empty)
            if [ "$NAME" = "." ]; then
              cp -rL "$DIST"/. _site/ 2>/dev/null || true
            else
              mkdir -p "_site/$NAME"
              cp -rL "$DIST"/. "_site/$NAME/" 2>/dev/null || true
            fi
            # Validate
            TARGET="_site"
            [ "$NAME" != "." ] && TARGET="_site/$NAME"
            COUNT=$(find "$TARGET" -type f 2>/dev/null | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "✅ $NAME ($COUNT files)"
              COPIED=$((COPIED + 1))
            else
              echo "❌ $NAME (0 files after copy)"
              FAILED="$FAILED $NAME"
            fi
          done
          # Summary
          echo "========================================="
          echo "📊 DEPLOY: $COPIED copied, $SKIPPED skipped"
          [ -n "$FAILED" ] && echo "⚠️ FAILED:$FAILED" && echo "::warning::Deploy failures:$FAILED"
          echo "========================================="
          # Clean broken symlinks
          find _site -type l ! -exec test -e {} \; -delete 2>/dev/null || true
          echo "📊 Site structure:"
          ls -lah _site/ | head -20
      - name: 🧭 Service fallback pages (cloud-webapps/<service>/dist)
        run: |
          # Generated per-service fallback sites (cloud-webapps scripts/gen-fallback.mjs): every
          # cloud-webapps/<folder>/dist/index.html not already published above ships at the same path.
          n=0
          for d in cloud-webapps/*/dist; do
            name="$(basename "$(dirname "$d")")"
            [ -f "$d/index.html" ] || continue
            [ -e "_site/cloud-webapps/$name" ] && continue
            mkdir -p "_site/cloud-webapps/$name"
            cp -rL "$d"/. "_site/cloud-webapps/$name/"
            n=$((n + 1))
          done
          echo "service fallback pages published: $n"
      - name: 🔀 Redirect stubs for renamed URLs
        run: node cloud-webapps/scripts/gen-redirects.mjs _site
      - name: ⬆️ Upload Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

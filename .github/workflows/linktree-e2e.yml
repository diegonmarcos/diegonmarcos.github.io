# Post-deploy smoke test for linktree.diegonmarcos.com. Fails when any section
# has no VISIBLE card with content (DOM node counts are not enough: slides can
# exist but be empty or transparent). Hand-written, not generated by 1_cicd.
name: Linktree E2E (post-deploy)
on:
  workflow_run:
    workflows: ["GitHub Pages Deployment (CI)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: URL to test
        default: https://linktree.diegonmarcos.com/
permissions:
  contents: read
jobs:
  sections-visible:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/front-linktree  # #1072: sources moved out of this repo
          sparse-checkout: a_Portals/linktree/tests/e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Sections show visible cards (mobile + desktop)
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          # Pages CDN may lag a few seconds behind the deploy job; retry.
          for i in 1 2 3; do
            node a_Portals/linktree/tests/e2e/sections-visible.mjs "${{ github.event.inputs.url || 'https://linktree.diegonmarcos.com/' }}" && exit 0
            echo "attempt $i failed; retrying in 30s"; sleep 30
          done
          exit 1
      - name: Every icon/image loads (5 cold loads + reload storm)
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          # A transient here is exactly the bug: no retry loop.
          cp a_Portals/linktree/tests/e2e/assets-load.mjs /tmp/pw/
          node /tmp/pw/assets-load.mjs "${{ github.event.inputs.url || 'https://linktree.diegonmarcos.com/' }}"

# cloud-superapp must carry the SAME Cloud app list as the SuperApp
# (diegonmarcos/cloud-u-android aa_cloud-superapp/build.json ui.sections[cloud]).
# Hand-written, not generated by 1_cicd.
#  1. sync-check: re-runs scripts/gen-nav.mjs --check against cloud-u-android main;
#     FAILS when src/data/nav.json, src/data/cloud-apps.json or src/public/icons/sa/
#     differ from the SuperApp (fix: node a_Portals/cloud-superapp/scripts/gen-nav.mjs).
#     Runs on every push/PR touching cloud-superapp, daily, and on dispatch, so a
#     SuperApp-side change is caught even when this repo does not move.
#  2. e2e: builds cloud-superapp and runs test/embed.spec.mjs in headless Chromium,
#     incl. /cloud/apps/?embed=1 rendering every SuperApp group.
name: Cloud Mobile — SuperApp sync
on:
  push:
    branches: [main]
    paths: ['a_Portals/cloud-superapp/**', 'cloud-webapps/**', '.github/workflows/cloud-superapp-sync.yml']
  pull_request:
    paths: ['a_Portals/cloud-superapp/**', 'cloud-webapps/**', '.github/workflows/cloud-superapp-sync.yml']
  schedule:
    - cron: '17 5 * * *'
  repository_dispatch:
    types: [cloud-web-refresh, superapp-updated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            a_Portals/cloud-superapp
            cloud-webapps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App list == SuperApp (gen-nav --check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node a_Portals/cloud-superapp/scripts/gen-nav.mjs --check
      - name: Shared web-app nav == SuperApp list (cloud-webapps gen-nav --check)
        run: node cloud-webapps/scripts/gen-nav.mjs --check
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install dependencies
        run: bash build.sh deps
      - name: Build cloud-superapp
        run: cd a_Portals/cloud-superapp && bash build.sh build
      - name: Install Playwright + Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Embed + Cloud App groups (headless Chromium)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node a_Portals/cloud-superapp/test/embed.spec.mjs

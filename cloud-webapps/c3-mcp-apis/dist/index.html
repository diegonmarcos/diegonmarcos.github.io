<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C3 MCP and APIs - Cloud</title><meta name="description" content="MCP and API config as declared JSON. Mock data unless signed in.">
<style>body{margin:0;background:#0b0f17;color:#e6e9ef;font:16px/1.5 system-ui,sans-serif}main{max-width:860px;margin:0 auto;padding:24px 16px}pre{background:#141a26;border:1px solid #243049;border-radius:12px;padding:16px;overflow:auto}small{color:#9aa4b2}</style><link rel="stylesheet" href="/cloud-webapps/nav.css"><script src="/cloud-webapps/nav.js" defer></script>
</head>
<body><main><h1>C3 MCP and APIs</h1><p id="src"><small>Mock data (signed out).</small></p><pre id="cfg"></pre>
<script>
var MOCK={"servers": [{"name": "mock-mcp", "path": "/mock/mcp", "auth": "bearer"}], "rate_limit_per_min": 60};
var EP="https://example.invalid/config/c3-mcp-apis"; // fleet endpoint behind Authelia/bearer; reads private cloud-me-* repos server-side. No GitHub token in the browser.
var tok=null;try{tok=sessionStorage.getItem("c3_bearer")}catch(e){}
function show(j,s){document.getElementById("cfg").textContent=JSON.stringify(j,null,2);document.getElementById("src").innerHTML="<small>"+s+"</small>"}
show(MOCK,"Mock data (signed out).");
if(tok)fetch(EP,{headers:{Authorization:"Bearer "+tok}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){show(j,"Live config")}).catch(function(){});
</script></main></body></html>

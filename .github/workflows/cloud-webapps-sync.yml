# Mirror diegonmarcos/cloud-h-webapps (public) into ./cloud-webapps and refresh Pages.
# Hand-written, not generated by 1_cicd. One-way: the cloud-h-webapps repo is the source;
# edits made to ./cloud-webapps here are overwritten by the next run.
#  - schedule: daily fallback; repository_dispatch cloud-webapps-bump: from cloud-h-webapps
#    bump-pages (needs its PAGES_BUMP_TOKEN secret); workflow_dispatch: manual.
#  - Commits only when the mirror changed, then sends repository_dispatch cloud-web-refresh,
#    which the Pages deploy (ship.yml) already listens for. (A push made with GITHUB_TOKEN
#    does not start ship.yml by itself.)
name: Cloud WebApps — mirror sync
on:
  schedule:
    - cron: '23 4 * * *'
  repository_dispatch:
    types: [cloud-webapps-bump]
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Refresh Pages even when the mirror did not change'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: cloud-webapps-sync
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud-webapps
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud-h-webapps
          path: _src
          fetch-depth: 1
      - name: Mirror cloud-h-webapps into ./cloud-webapps
        run: |
          src_sha=$(git -C _src rev-parse --short HEAD)
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='README.md' _src/ cloud-webapps/
          rm -rf _src
          echo "SRC_SHA=$src_sha" >> "$GITHUB_ENV"
      - name: Commit and refresh Pages
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.refresh }}
        run: |
          changed=false
          git add -A cloud-webapps
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "auto: mirror cloud-h-webapps@${SRC_SHA} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            changed=true
          fi
          if [ "$changed" = true ] || [ "$FORCE" = true ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=cloud-web-refresh
            echo "Pages refresh dispatched (changed=$changed)"
          else
            echo "Mirror unchanged; nothing to do"
          fi

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mySocials — local post editor</title>
<style>
  :root {
    --bg: #0a0c14;
    --fg: #e4e6eb;
    --card: #171a24;
    --border: #262b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, sans-serif;
  }
  #topbar {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  select, button, input, textarea {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 13px;
  }
  button {
    cursor: pointer;
  }
  button:hover { border-color: #4a5170; }
  #status { margin-left: auto; opacity: 0.8; font-size: 13px; }
  #status.dirty { color: #f0b429; }
  #posts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    gap: 12px;
  }
  .thumb {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    background: #0e1017;
    flex: none;
    border: 1px solid var(--border);
  }
  .fields {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .fields label {
    font-size: 11px;
    opacity: 0.65;
    display: block;
    margin-bottom: 2px;
  }
  .fields textarea {
    width: 100%;
    min-height: 50px;
    resize: vertical;
  }
  .fields input[type="text"] {
    width: 100%;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .row > div { flex: 1; min-width: 140px; }
  .card-actions {
    display: flex;
    gap: 6px;
    flex: none;
    flex-direction: column;
    justify-content: space-between;
  }
  #profileCard {
    margin: 14px 14px 0 14px;
  }
  #profileCard .fields {
    justify-content: center;
  }
  #profileName {
    font-size: 13px;
    opacity: 0.85;
  }
  #log {
    margin: 14px;
    padding: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    white-space: pre-wrap;
    font-size: 12px;
    max-height: 300px;
    overflow: auto;
  }
</style>
</head>
<body>
<div id="topbar">
  <select id="accountSelect"></select>
  <button id="addBtn">Add post</button>
  <button id="saveBtn">Save</button>
  <button id="publishBtn">Publish</button>
  <button id="tokenBtn">Token</button>
  <span id="status">loading…</span>
</div>
<div id="profileCard" class="card">
  <img id="profileThumb" class="thumb" src="" alt="">
  <div class="fields">
    <label>account</label>
    <div id="profileName">—</div>
    <label>replace profile photo</label>
    <input id="profileFileInput" type="file" accept="image/*">
  </div>
</div>
<div id="posts"></div>
<pre id="log" style="display:none;"></pre>

<script>
// Data-driven account registry — ported from serve.mjs.
const ACCOUNTS = {
  "ig0-diegocnmarcos_": { media_dir: "diegocnmarcos_", schema: "ig" },
  "ig1-diegocmarcos_": { media_dir: "diegocmarcos_", schema: "ig" },
  "ig2-diegonmarcos": { media_dir: "", schema: "ig" },
  "facebook-diegonmarcos": { media_dir: "facebook-diegonmarcos", schema: "fb" },
};

const DATA_DIR = "/git/front/b-Media/mySocials/src/data";
const DIST_DIR = "/git/front/b-Media/mySocials/dist";
const CDN_MEDIA_ROOT = "/git/front-assets-cdn/b-Media/mySocials/static/media";
const JSDELIVR_BASE = "https://cdn.jsdelivr.net/gh/diegonmarcos/front-assets-cdn@main/b-Media/mySocials/static/media";

function accountJsonPath(account) {
  return DATA_DIR + "/" + account + ".json";
}

function wrapperPaths(account) {
  return [DATA_DIR + "/data-" + account + ".json.js", DIST_DIR + "/data-" + account + ".json.js"];
}

// Filesystem dir on the CDN repo for this account's post media.
function mediaPostsDir(account) {
  const mediaDir = ACCOUNTS[account].media_dir;
  const parts = [mediaDir, "posts"].filter(Boolean);
  return [CDN_MEDIA_ROOT].concat(parts).join("/");
}

function jsdelivrUrl(account, filename) {
  const mediaDir = ACCOUNTS[account].media_dir;
  const parts = [mediaDir, "posts", filename].filter(Boolean);
  return JSDELIVR_BASE + "/" + parts.join("/");
}

// Filesystem dir on the CDN repo for all accounts' profile photos.
function mediaProfilesDir() {
  return CDN_MEDIA_ROOT + "/profiles";
}

function profileFilename(account, uploadedFilename) {
  const ext = extname(uploadedFilename).toLowerCase();
  return account + ext;
}

function jsdelivrProfileUrl(account, uploadedFilename) {
  const filename = profileFilename(account, uploadedFilename);
  return JSDELIVR_BASE + "/profiles/" + filename;
}

function extname(name) {
  const idx = name.lastIndexOf(".");
  return idx === -1 ? "" : name.slice(idx);
}

function sanitizeFilename(name) {
  name = name.split("/").pop().split("\\").pop();
  return name.replace(/[^A-Za-z0-9._-]/g, "_");
}

function wrapperContent(key, data) {
  return (
    "// GENERATED FROM " + key + ".json by front-data-json-js-wrapper.sh — DO NOT EDIT BY HAND.\n" +
    "// Re-generate with: bash a-Portals/linktree/src/data/build.sh\n" +
    "(function () {\n" +
    "  var g = (typeof globalThis !== \"undefined\") ? globalThis : (typeof window !== \"undefined\" ? window : this);\n" +
    "  g.PORTAL_DATA = g.PORTAL_DATA || {};\n" +
    "  g.PORTAL_DATA[\"" + key + "\"] = " + JSON.stringify(data, null, 2) + ";\n" +
    "})();\n"
  );
}

// --- Host file-server API -------------------------------------------------

const TOKEN_KEY = "mySocials_editor_token";

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || "";
}

function setToken(t) {
  localStorage.setItem(TOKEN_KEY, t);
}

function promptForToken() {
  const t = prompt("Enter the shared secret token (cat ~/.cache/my-webserver.token):") || "";
  if (t) setToken(t);
  return t;
}

async function ensureToken() {
  let t = getToken();
  if (!t) t = promptForToken();
  return t;
}

function mutatingHeaders() {
  return {
    "Content-Type": "application/json",
    "X-Httpd-Write": "1",
    "X-Httpd-Token": getToken(),
  };
}

async function apiRead(path) {
  const res = await fetch("/__api__/read?path=" + encodeURIComponent(path));
  if (!res.ok) {
    throw new Error("read failed (" + res.status + "): " + path);
  }
  return res.json();
}

async function apiWrite(path, payload, retry) {
  await ensureToken();
  const body = Object.assign({ path: path }, payload);
  const res = await fetch("/__api__/write", {
    method: "POST",
    headers: mutatingHeaders(),
    body: JSON.stringify(body),
  });
  if (res.status === 403) {
    const data = await res.json().catch(() => ({}));
    const msg = "Write forbidden (403) for " + path + ": " + (data.error || JSON.stringify(data));
    if (!retry && confirm(msg + "\n\nRe-enter token and retry?")) {
      if (promptForToken()) return apiWrite(path, payload, true);
    }
    throw new Error(msg);
  }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error("write failed (" + res.status + ") for " + path + ": " + (data.error || ""));
  }
  return res.json();
}

async function apiGit(repo, message, paths, retry) {
  await ensureToken();
  const res = await fetch("/__api__/git", {
    method: "POST",
    headers: mutatingHeaders(),
    body: JSON.stringify({ repo: repo, message: message, paths: paths }),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 403) {
    const msg = "Git forbidden (403) for " + repo + ": " + (data.error || JSON.stringify(data));
    if (!retry && confirm(msg + "\n\nRe-enter token and retry?")) {
      if (promptForToken()) return apiGit(repo, message, paths, true);
    }
    throw new Error(msg);
  }
  if (!res.ok) {
    throw new Error("git failed (" + res.status + ") for " + repo + ": " + (data.log || data.error || ""));
  }
  return data;
}

// --- Editor state ----------------------------------------------------------

let currentAccount = null;
let currentSchema = null;
let currentData = null; // full parsed account json — only .posts / .profile get mutated
let posts = [];
let profile = null;
let dirty = false;
let newProfilePhotoUrl = "";

const postsEl = document.getElementById("posts");
const statusEl = document.getElementById("status");
const accountSelect = document.getElementById("accountSelect");
const logEl = document.getElementById("log");
const profileThumbEl = document.getElementById("profileThumb");
const profileNameEl = document.getElementById("profileName");
const profileFileInputEl = document.getElementById("profileFileInput");

const SCHEMA_FIELDS = {
  ig: [
    { key: "id", label: "id", type: "input" },
    { key: "caption", label: "caption", type: "textarea" },
    { key: "time", label: "time (unix seconds)", type: "input" },
    { key: "location", label: "location", type: "input" },
  ],
  fb: [
    { key: "content", label: "content", type: "textarea" },
    { key: "timestamp", label: "timestamp", type: "input" },
    { key: "album", label: "album", type: "input" },
  ],
};

function emptyPost(schema) {
  if (schema === "ig") {
    return { id: "", media: "", caption: "", media_all: [], time: "", location: "" };
  }
  return { timestamp: "", content: "", media: [], album: "" };
}

function markDirty() {
  dirty = true;
  statusEl.textContent = "unsaved changes";
  statusEl.className = "dirty";
}

function markClean(msg) {
  dirty = false;
  statusEl.textContent = msg || "up to date";
  statusEl.className = "";
}

window.addEventListener("beforeunload", (e) => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});

function thumbSrc(post) {
  if (currentSchema === "ig") {
    return post._localPreview || post.media || "";
  }
  return post._localPreview || (Array.isArray(post.media) ? post.media[0] : "") || "";
}

function render() {
  postsEl.innerHTML = "";
  const fields = SCHEMA_FIELDS[currentSchema];
  posts.forEach((post, idx) => {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.className = "thumb";
    img.src = thumbSrc(post);
    img.onerror = () => { img.style.opacity = "0.3"; };
    card.appendChild(img);

    const fieldsWrap = document.createElement("div");
    fieldsWrap.className = "fields";

    const row = document.createElement("div");
    row.className = "row";
    fields.forEach((f) => {
      const wrap = document.createElement("div");
      const label = document.createElement("label");
      label.textContent = f.label;
      wrap.appendChild(label);
      let input;
      if (f.type === "textarea") {
        input = document.createElement("textarea");
      } else {
        input = document.createElement("input");
        input.type = "text";
      }
      input.value = post[f.key] ?? "";
      input.addEventListener("input", () => {
        post[f.key] = input.value;
        markDirty();
      });
      wrap.appendChild(input);
      if (f.type === "textarea") {
        fieldsWrap.appendChild(wrap);
      } else {
        row.appendChild(wrap);
      }
    });
    fieldsWrap.appendChild(row);

    const fileWrap = document.createElement("div");
    const fileLabel = document.createElement("label");
    fileLabel.textContent = "replace image";
    fileWrap.appendChild(fileLabel);
    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.addEventListener("change", () => onImageChange(fileInput, post, img));
    fileWrap.appendChild(fileInput);
    fieldsWrap.appendChild(fileWrap);

    card.appendChild(fieldsWrap);

    const actions = document.createElement("div");
    actions.className = "card-actions";
    const removeBtn = document.createElement("button");
    removeBtn.textContent = "Remove";
    removeBtn.addEventListener("click", () => {
      if (confirm("Remove this post?")) {
        posts.splice(idx, 1);
        markDirty();
        render();
      }
    });
    actions.appendChild(removeBtn);
    card.appendChild(actions);

    postsEl.appendChild(card);
  });
}

function renderProfile() {
  const photo = newProfilePhotoUrl && profile && profile._localPreview
    ? profile._localPreview
    : (profile && profile.photo) || "";
  profileThumbEl.src = photo;
  const name = (profile && (profile.username || profile.name)) || "";
  profileNameEl.textContent = name || "—";
}

async function onProfileImageChange() {
  const file = profileFileInputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    const b64 = dataUrl.substring(dataUrl.indexOf(",") + 1);
    try {
      const safeName = profileFilename(currentAccount, sanitizeFilename(file.name));
      const targetFile = mediaProfilesDir() + "/" + safeName;
      await apiWrite(targetFile, { b64: b64 });
      newProfilePhotoUrl = jsdelivrProfileUrl(currentAccount, file.name);
      if (profile) profile._localPreview = targetFile;
      profileThumbEl.src = targetFile;
      markDirty();
    } catch (e) {
      alert("Upload failed: " + e.message);
    }
  };
  reader.readAsDataURL(file);
}
profileFileInputEl.addEventListener("change", onProfileImageChange);

function onImageChange(fileInput, post, imgEl) {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    const b64 = dataUrl.substring(dataUrl.indexOf(",") + 1);
    try {
      const safeName = sanitizeFilename(file.name);
      const targetFile = mediaPostsDir(currentAccount) + "/" + safeName;
      await apiWrite(targetFile, { b64: b64 });
      const url = jsdelivrUrl(currentAccount, safeName);
      if (currentSchema === "ig") {
        post.media = url;
        post.media_all = [url];
      } else {
        post.media = [url];
      }
      post._localPreview = targetFile;
      imgEl.src = targetFile;
      markDirty();
    } catch (e) {
      alert("Upload failed: " + e.message);
    }
  };
  reader.readAsDataURL(file);
}

function loadAccounts() {
  accountSelect.innerHTML = "";
  Object.keys(ACCOUNTS).forEach((key) => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.dataset.schema = ACCOUNTS[key].schema;
    opt.textContent = key;
    accountSelect.appendChild(opt);
  });
  const first = Object.keys(ACCOUNTS)[0];
  if (first) loadAccount(first, ACCOUNTS[first].schema);
}

async function loadAccount(key, schema) {
  if (dirty && !confirm("You have unsaved changes. Discard them?")) {
    accountSelect.value = currentAccount;
    return;
  }
  currentAccount = key;
  currentSchema = schema;
  accountSelect.value = key;
  statusEl.textContent = "loading…";
  try {
    const file = await apiRead(accountJsonPath(key));
    currentData = JSON.parse(file.content);
    posts = currentData.posts || [];
    profile = currentData.profile || null;
    newProfilePhotoUrl = "";
    markClean("loaded " + key);
    render();
    renderProfile();
  } catch (e) {
    statusEl.textContent = "load failed: " + e.message;
    statusEl.className = "dirty";
  }
}

accountSelect.addEventListener("change", () => {
  const opt = accountSelect.selectedOptions[0];
  loadAccount(opt.value, opt.dataset.schema);
});

document.getElementById("addBtn").addEventListener("click", () => {
  posts.push(emptyPost(currentSchema));
  markDirty();
  render();
});

document.getElementById("tokenBtn").addEventListener("click", () => {
  promptForToken();
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  statusEl.textContent = "saving…";
  const cleanPosts = posts.map((p) => {
    const copy = Object.assign({}, p);
    delete copy._localPreview;
    return copy;
  });
  const data = Object.assign({}, currentData);
  data.posts = cleanPosts;
  if (data.profile && typeof data.profile === "object" && !Array.isArray(data.profile)) {
    const profileCopy = Object.assign({}, data.profile);
    delete profileCopy._localPreview;
    if (typeof profileCopy.posts === "number") profileCopy.posts = cleanPosts.length;
    if (newProfilePhotoUrl) profileCopy.photo = newProfilePhotoUrl;
    data.profile = profileCopy;
  }
  try {
    // 2-space indent — matches how all four account jsons are already formatted.
    // Using anything else reformats the whole file on every save and buries the
    // real change under hundreds of whitespace-only diff lines.
    const jsonContent = JSON.stringify(data, null, 2) + "\n";
    await apiWrite(accountJsonPath(currentAccount), { content: jsonContent });
    const [wrapperDataPath, wrapperDistPath] = wrapperPaths(currentAccount);
    const wrapper = wrapperContent(currentAccount, data);
    await apiWrite(wrapperDataPath, { content: wrapper });
    await apiWrite(wrapperDistPath, { content: wrapper });
    currentData = data;
    if (profile) {
      delete profile._localPreview;
      if (newProfilePhotoUrl) profile.photo = newProfilePhotoUrl;
    }
    newProfilePhotoUrl = "";
    markClean("saved");
  } catch (e) {
    statusEl.textContent = "save failed: " + e.message;
    statusEl.className = "dirty";
  }
});

document.getElementById("publishBtn").addEventListener("click", async () => {
  statusEl.textContent = "publishing…";
  const message = "content(mySocials): update posts via local editor";
  try {
    const cdnResult = await apiGit(
      "/git/front-assets-cdn",
      message,
      ["b-Media/mySocials/static/media"]
    );
    const frontResult = await apiGit(
      "/git/front",
      message,
      ["b-Media/mySocials/src/data", "b-Media/mySocials/dist"]
    );
    logEl.style.display = "block";
    logEl.textContent = (cdnResult.log || "") + "\n\n" + (frontResult.log || "");
    statusEl.textContent = "published";
    statusEl.className = "";
  } catch (e) {
    logEl.style.display = "block";
    logEl.textContent = e.message;
    statusEl.textContent = "publish failed: " + e.message;
    statusEl.className = "dirty";
  }
});

loadAccounts();
</script>
</body>
</html>

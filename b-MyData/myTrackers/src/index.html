<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTrackers — Quantified-Self App Roster</title>
  <meta name="description" content="Data-driven roster of tracker and activity apps — travel, fitness and activity, all in one place">
  <meta name="theme-color" content="#08090c">
  <link rel="stylesheet" href="style.css">

<!-- Umami Analytics -->
<script async src="https://analytics.diegonmarcos.com/umami/script.js" data-website-id="937cbde7-5ec2-450c-9d6a-8117423ac12f"></script>

<body>
  <header class="app-header">
    <div class="app-header__brand">
      <svg class="app-header__logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        <circle cx="12" cy="12" r="4"/>
      </svg>
      <h1 class="app-header__title">MyTrackers</h1>
    </div>
    <p class="app-header__subtitle">Every quantified-self app, one roster.</p>
  </header>

  <main class="dashboard">
    <div id="tracker-root" class="tracker-root"></div>
  </main>

  <script src="script.js"></script>

  <div class="theme-switch" id="theme-switch">
    <div class="theme-switch__row theme-switch__row--hubs">
      <span class="theme-switch__label">myProfile :</span>
      <a class="theme-switch__hub-link" href="/mySocials">mySocials</a>
      <span class="theme-switch__divider">|</span>
      <a class="theme-switch__hub-link theme-switch__hub-link--active" href="/myTrackers">myTrackers</a>
    </div>
    <div class="theme-switch__row">
      <button class="theme-switch__btn" data-theme-btn="mytrips">myTrips</button>
      <span class="theme-switch__divider">|</span>
      <button class="theme-switch__btn" data-theme-btn="mytracks">myTracks</button>
    </div>
    <div class="theme-switch__row">
      <a class="theme-switch__btn" href="https://nomadmania.com" target="_blank">NomadMania</a>
      <a class="theme-switch__btn" href="https://maps.google.com" target="_blank">Google Maps</a>
      <span class="theme-switch__divider">|</span>
      <a class="theme-switch__btn" href="https://strava.com" target="_blank">Strava</a>
      <a class="theme-switch__btn" href="https://komoot.com" target="_blank">Komoot</a>
      <a class="theme-switch__btn" href="https://alltrails.com" target="_blank">AllTrails</a>
      <span class="theme-switch__divider">|</span>
      <a class="theme-switch__btn" href="https://connect.garmin.com" target="_blank">Garmin</a>
      <a class="theme-switch__btn" href="https://fit.google.com" target="_blank">Google Fit</a>
      <span class="theme-switch__divider">|</span>
      <a class="theme-switch__btn" href="https://myfitnesspal.com" target="_blank">myFitnessPal</a>
    </div>
  </div>
</body>
</html>

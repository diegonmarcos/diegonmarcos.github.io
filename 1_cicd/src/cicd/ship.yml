        if:
          contains(steps.changed-files.outputs.all_changed_files, 'a_Portals/linktree_icon-view/src/')

        run: |
          echo "🔨 Building Linktree Icon View..."
          cd a_Portals/linktree_icon-view
          bash build.sh build
          cd ../..

# Hand-written, not generated by 1_cicd.
# Refreshes the declarative GitHub Pages list behind linktree.diegonmarcos.com/gh:
# scripts/gh-pages-gen.mjs reads ship.yml PROJECTS (+ titles, custom domains, descriptions, commit dates),
# adds separate Pages repos from the GitHub API, probes every URL, and rewrites a_Portals/linktree/src/data/gh-pages.json (+ wrapper + dist copy).
#  - schedule: daily; workflow_dispatch: manual.
#  - Commits only when the list changed, then sends repository_dispatch cloud-web-refresh,
#    which the Pages deploy (ship.yml) listens for. (A push made with GITHUB_TOKEN does not
#    start ship.yml by itself.)
#  - Secret GH_PAGES_TOKEN (optional, read access to the owner's repos incl. Pages) lets the
#    generator read each repo's custom domain; without it the default token is used and the
#    custom domain falls back to the repo's CNAME file.
name: Linktree /gh — refresh Pages list
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-list
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit dates per project
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the list
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN || github.token }}
        run: node a_Portals/linktree/scripts/gh-pages-gen.mjs diegonmarcos
      - name: Commit and refresh Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add a_Portals/linktree/src/data/gh-pages.json a_Portals/linktree/src/data/data-gh-pages.json.js a_Portals/linktree/dist/data-gh-pages.json.js
          if git diff --cached --quiet; then
            echo "List unchanged; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: refresh linktree /gh Pages list [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=cloud-web-refresh
          echo "Pages refresh dispatched"

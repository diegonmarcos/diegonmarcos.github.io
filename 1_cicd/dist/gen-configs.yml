name: "Regenerate config data (1_front-configs)"

on:
  push:
    branches: [main]
    paths:
      - '**/build.json'
      - '**/package.json'
      - 'build.sh'
      - 'Lnktree/linktree/src/data/**.json'
      - '1_front-configs/build.sh'
      - '1_front-configs/build.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-configs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #1072: linktree and the project sources live in their own public repos;
      # overlay them at their original paths so every path below still resolves.
      - name: 🧩 Overlay split source repos
        run: |
          for r in Projects-endeavours cloud-me-others Me-Profiles-Prf-Prs Me-Profiles-_Lnktree CG-galaxy CG-circus Projects-labtools cloud-h-webapps-2; do
            git clone --depth 1 "https://github.com/diegonmarcos/$r.git" "$RUNNER_TEMP/$r"
            rsync -a --exclude='.git' --exclude='README.md' --exclude='SPLIT-PATHS.txt' --exclude='/.gitmodules' --exclude='/0_deployer' --exclude='/1_cicd' --exclude='/.github' --exclude='/a_Companies/leafy' --exclude='/a_Companies/nexus' --exclude='/a_Companies/stark' "$RUNNER_TEMP/$r/" ./
            sed 's#^#/#' "$RUNNER_TEMP/$r/SPLIT-PATHS.txt" >> .git/info/exclude
          done
          # #1224: one-project repos (project at the repo root, not a mirrored layout) are overlaid at the path
          # the project had before the move, so every path below and every published URL is unchanged.
          for pair in Me-Profiles-Leaf.y:a_Companies/leafy Me-Profiles-Nexus.z:a_Companies/nexus Me-Profiles-Stark.x:a_Companies/stark Fin-CM-mqpm:a_Companies/mqpm Fin-CM-Blmbrg:a_Companies/blmbrg DeepSc-X:a_Companies/deepsc-x; do
            r="${pair%%:*}"; d="${pair##*:}"
            git clone --depth 1 "https://github.com/diegonmarcos/$r.git" "$RUNNER_TEMP/$r"
            mkdir -p "$d"
            rsync -a --exclude='.git' --exclude='/README.md' --exclude='/.gitmodules' --exclude='/0_deployer' --exclude='/1_cicd' --exclude='/.github' --exclude='/build.sh' --exclude='/ship.yml' "$RUNNER_TEMP/$r/" "$d/"
            ln -sfn ../../1_cicd/src/scripts/_engine.sh "$d/build.sh"
            ln -sfn ../../.github/workflows/ship.yml "$d/ship.yml"
            echo "/$d" >> .git/info/exclude
          done

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      # build.sh config → 1_front-configs/build.sh rebuild (consolidate + derive
      # front-topology.json + front-deps.json + front-data-*.json) → master index.
      # All outputs are committed in-repo; no submodule checkout needed.
      - name: Regenerate config data
        run: bash build.sh config

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 1_front-configs/dist/ 1_front-configs/src/ 0_______________________________/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: regenerate config data [skip ci]"
          git pull --rebase origin main
          git push

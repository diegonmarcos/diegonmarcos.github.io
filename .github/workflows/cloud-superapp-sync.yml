# The published SuperApp mimic (/cloud-webapps/, built in diegonmarcos/cloudy-h-webapps and mirrored to ./cloud-webapps)
# must carry the SAME navigation as the SuperApp (diegonmarcos/cloudy-u-android aa_cloud-superapp/build.json ui).
# Hand-written, not generated by 1_cicd.
# Since the #1320 M7 cut-over the old replica (a_Portals/cloud-superapp) is no longer published: its pages redirect to
# /cloud-webapps/ (cloud-webapps/scripts/gen-redirects.mjs). cloudy-h-webapps' own CI builds the sites, drift-checks the
# generated nav against Android and runs the Playwright embed spec (phone + tablet); this workflow re-checks the mirror:
#  1. sync-check: the shared service-page nav (cloud-webapps gen-nav.mjs --check) == the SuperApp list, daily and on
#     dispatch, so a SuperApp-side change is caught even when this repo does not move.
#  2. mirror: the mirrored dists prerender every route (test-routes.mjs) and every old URL lands on a served page
#     (test-old-urls.mjs), so a stale or partial mirror fails before Pages publishes it.
name: Cloud Mobile — SuperApp sync
on:
  push:
    branches: [main]
    paths: ['cloud-webapps/**', '.github/workflows/cloud-superapp-sync.yml']
  pull_request:
    paths: ['cloud-webapps/**', '.github/workflows/cloud-superapp-sync.yml']
  schedule:
    - cron: '17 5 * * *'
  repository_dispatch:
    types: [cloud-web-refresh, superapp-updated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud-webapps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared web-app nav == SuperApp list (cloud-webapps gen-nav --check)
        run: node cloud-webapps/scripts/gen-nav.mjs --check
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud-webapps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every route prerendered in the mirrored dist
        run: node cloud-webapps/scripts/test-routes.mjs
      - name: Every old URL lands on a served page
        run: node cloud-webapps/scripts/test-old-urls.mjs
